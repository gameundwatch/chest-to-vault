name: CI

# develop・main への PR で、format・lint・JUnit（check）と GameTest を実行する。
# ルールセットで、この job（test）の成功をマージの条件にする。
on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: ./gradlew check runGameTestServer
